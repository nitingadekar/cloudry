<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Compress - Cloudry</title>
    <meta name="description" content="Compress images online for free. Reduce JPEG, PNG, WebP file size without visible quality loss.">
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☁️</text></svg>">
</head>
<body class="bg-gray-50 min-h-screen">
    <!-- Header -->
    <header class="bg-white shadow-sm">
        <div class="max-w-4xl mx-auto px-4 py-4 flex items-center justify-between">
            <a href="../" class="flex items-center gap-2">
                <span class="text-2xl">☁️</span>
                <span class="text-xl font-bold text-gray-800">Cloudry</span>
            </a>
            <a href="../" class="text-sm text-blue-600 hover:underline">← All Tools</a>
        </div>
    </header>

    <!-- Tool -->
    <main class="max-w-2xl mx-auto px-4 py-12" x-data="imageCompress()">
        <h1 class="text-3xl font-bold text-gray-900 mb-2">🗜️ Image Compress</h1>
        <p class="text-gray-600 mb-8">Reduce image file size without visible quality loss. Supports JPEG, PNG, WebP.</p>

        <!-- Upload Area -->
        <div class="bg-white rounded-xl border-2 border-dashed border-gray-300 p-8 text-center hover:border-blue-400 transition cursor-pointer"
             @click="$refs.fileInput.click()"
             @dragover.prevent="dragOver = true"
             @dragleave="dragOver = false"
             @drop.prevent="handleDrop($event)"
             :class="{ 'border-blue-400 bg-blue-50': dragOver }">
            
            <input type="file" x-ref="fileInput" @change="handleFile($event)" accept="image/*" class="hidden">
            
            <template x-if="!file">
                <div>
                    <p class="text-4xl mb-3">📁</p>
                    <p class="text-gray-700 font-medium">Drop an image here or click to select</p>
                    <p class="text-sm text-gray-500 mt-1">JPEG, PNG, WebP • Max 20MB</p>
                </div>
            </template>
            
            <template x-if="file">
                <div>
                    <p class="text-4xl mb-3">✅</p>
                    <p class="text-gray-700 font-medium" x-text="file.name"></p>
                    <p class="text-sm text-gray-500" x-text="formatSize(file.size)"></p>
                </div>
            </template>
        </div>

        <!-- Quality Slider -->
        <div class="mt-6" x-show="file">
            <label class="block text-sm font-medium text-gray-700 mb-2">
                Quality: <span class="text-blue-600 font-bold" x-text="quality + '%'"></span>
            </label>
            <input type="range" min="10" max="95" x-model="quality" class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer">
            <div class="flex justify-between text-xs text-gray-500 mt-1">
                <span>Smaller file</span>
                <span>Better quality</span>
            </div>
        </div>

        <!-- Compress Button -->
        <button x-show="file" @click="compress()" :disabled="loading"
                class="mt-6 w-full bg-blue-600 text-white py-3 px-6 rounded-lg font-medium hover:bg-blue-700 disabled:bg-gray-400 disabled:cursor-not-allowed transition">
            <span x-show="!loading">🗜️ Compress Image</span>
            <span x-show="loading">⏳ Compressing...</span>
        </button>

        <!-- Status -->
        <p id="status" class="mt-4 text-sm font-medium"></p>
        <div id="result" class="hidden"></div>
    </main>

    <!-- Footer -->
    <footer class="mt-16 py-8 text-center text-sm text-gray-500">
        <p>🔒 Files processed in memory. Never stored on our servers.</p>
    </footer>

    <script src="../assets/js/app.js"></script>
    <script>
    function imageCompress() {
        return {
            file: null,
            quality: 75,
            loading: false,
            dragOver: false,

            handleFile(event) {
                this.file = event.target.files[0];
            },

            handleDrop(event) {
                this.dragOver = false;
                this.file = event.dataTransfer.files[0];
            },

            formatSize(bytes) {
                if (bytes < 1024) return bytes + ' B';
                if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
                return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
            },

            async compress() {
                if (!this.file) return;
                this.loading = true;

                const formData = new FormData();
                formData.append('file', this.file);
                formData.append('quality', this.quality);

                try {
                    await submitTool('/image/compress', formData, `compressed_${this.file.name}`);
                } catch (e) {
                    // Error already shown by submitTool
                }
                this.loading = false;
            }
        };
    }
    </script>
</body>
</html>
