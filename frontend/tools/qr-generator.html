<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Generator - Cloudry</title>
    <meta name="description" content="Generate QR codes online for free. Create QR codes for URLs, text, WiFi, and more.">
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☁️</text></svg>">
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-494WQJ79BE"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-494WQJ79BE');
</script>
</head>
<body class="bg-gray-50 min-h-screen">
    <header class="bg-white shadow-sm">
        <div class="max-w-4xl mx-auto px-4 py-4 flex items-center justify-between">
            <a href="../" class="flex items-center gap-2">
                <span class="text-2xl">☁️</span>
                <span class="text-xl font-bold text-gray-800">Cloudry</span>
            </a>
            <a href="../" class="text-sm text-blue-600 hover:underline">← All Tools</a>
        </div>
    </header>

    <main class="max-w-2xl mx-auto px-4 py-12" x-data="qrGenerator()">
        <h1 class="text-3xl font-bold text-gray-900 mb-2">📱 QR Code Generator</h1>
        <p class="text-gray-600 mb-8">Generate QR codes for URLs, text, WiFi credentials, and more.</p>

        <div class="bg-white rounded-xl shadow-sm border p-6">
            <!-- Input -->
            <label class="block text-sm font-medium text-gray-700 mb-2">Text or URL</label>
            <textarea x-model="data" rows="3" placeholder="https://cloudry.in or any text..."
                      class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:ring-2 focus:ring-blue-500 focus:border-transparent"></textarea>

            <!-- Options -->
            <div class="grid grid-cols-2 gap-4 mt-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Format</label>
                    <select x-model="format" class="w-full border border-gray-300 rounded-lg px-3 py-2">
                        <option value="png">PNG</option>
                        <option value="svg">SVG</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Size</label>
                    <select x-model="size" class="w-full border border-gray-300 rounded-lg px-3 py-2">
                        <option value="5">Small</option>
                        <option value="10" selected>Medium</option>
                        <option value="20">Large</option>
                        <option value="30">Extra Large</option>
                    </select>
                </div>
            </div>

            <!-- Generate Button -->
            <button @click="generate()" :disabled="!data.trim() || loading"
                    class="mt-6 w-full bg-blue-600 text-white py-3 px-6 rounded-lg font-medium hover:bg-blue-700 disabled:bg-gray-400 disabled:cursor-not-allowed transition">
                <span x-show="!loading">📱 Generate QR Code</span>
                <span x-show="loading">⏳ Generating...</span>
            </button>
        </div>

        <!-- Status -->
        <p id="status" class="mt-4 text-sm font-medium"></p>
        <div id="result" class="hidden"></div>
    </main>

    <footer class="mt-16 py-8 text-center text-sm text-gray-500">
        <p>🔒 No data stored. QR codes generated instantly.</p>
    </footer>

    <script src="../assets/js/app.js"></script>
    <script>
    function qrGenerator() {
        return {
            data: '',
            format: 'png',
            size: '10',
            loading: false,

            async generate() {
                if (!this.data.trim()) return;
                this.loading = true;

                const formData = new FormData();
                formData.append('data', this.data);
                formData.append('format', this.format);
                formData.append('size', this.size);

                try {
                    const ext = this.format === 'svg' ? 'svg' : 'png';
                    await submitTool('/qr/generate', formData, `qrcode.${ext}`);
                } catch (e) {}
                this.loading = false;
            }
        };
    }
    </script>
</body>
</html>
