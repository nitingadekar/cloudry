<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Base64 Encode/Decode - Cloudry</title>
    <meta name="description" content="Encode and decode Base64 text and files online for free.">
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☁️</text></svg>">
</head>
<body class="bg-gray-50 min-h-screen">
    <header class="bg-white shadow-sm">
        <div class="max-w-4xl mx-auto px-4 py-4 flex items-center justify-between">
            <a href="../" class="flex items-center gap-2"><span class="text-2xl">☁️</span><span class="text-xl font-bold text-gray-800">Cloudry</span></a>
            <a href="../" class="text-sm text-blue-600 hover:underline">← All Tools</a>
        </div>
    </header>

    <main class="max-w-3xl mx-auto px-4 py-12" x-data="base64Tool()">
        <h1 class="text-3xl font-bold text-gray-900 mb-2">🔤 Base64 Encode / Decode</h1>
        <p class="text-gray-600 mb-8">Encode text to Base64 or decode Base64 back to text. Works locally in your browser.</p>

        <!-- Tabs -->
        <div class="flex gap-2 mb-6">
            <button @click="mode = 'encode'" :class="mode === 'encode' ? 'bg-blue-600 text-white' : 'bg-white text-gray-700 border'"
                    class="px-4 py-2 rounded-lg font-medium transition">Encode</button>
            <button @click="mode = 'decode'" :class="mode === 'decode' ? 'bg-blue-600 text-white' : 'bg-white text-gray-700 border'"
                    class="px-4 py-2 rounded-lg font-medium transition">Decode</button>
        </div>

        <!-- Encode -->
        <div x-show="mode === 'encode'">
            <label class="block text-sm font-medium text-gray-700 mb-2">Text to encode</label>
            <textarea x-model="input" rows="5" placeholder="Enter text here..."
                      class="w-full border border-gray-300 rounded-lg px-4 py-3 font-mono text-sm focus:ring-2 focus:ring-blue-500 resize-none"></textarea>
            <button @click="encode()" :disabled="!input.trim()"
                    class="mt-4 w-full bg-blue-600 text-white py-3 rounded-lg font-medium hover:bg-blue-700 disabled:bg-gray-400 transition">
                Encode to Base64
            </button>
        </div>

        <!-- Decode -->
        <div x-show="mode === 'decode'">
            <label class="block text-sm font-medium text-gray-700 mb-2">Base64 to decode</label>
            <textarea x-model="input" rows="5" placeholder="Paste Base64 string here..."
                      class="w-full border border-gray-300 rounded-lg px-4 py-3 font-mono text-sm focus:ring-2 focus:ring-blue-500 resize-none"></textarea>
            <button @click="decode()" :disabled="!input.trim()"
                    class="mt-4 w-full bg-blue-600 text-white py-3 rounded-lg font-medium hover:bg-blue-700 disabled:bg-gray-400 transition">
                Decode from Base64
            </button>
        </div>

        <!-- Output -->
        <div x-show="output" class="mt-6">
            <div class="flex items-center justify-between mb-2">
                <label class="text-sm font-medium text-gray-700">Result</label>
                <button @click="navigator.clipboard.writeText(output); copied = true; setTimeout(() => copied = false, 2000)"
                        class="text-sm text-blue-600 hover:underline" x-text="copied ? '✓ Copied!' : 'Copy'"></button>
            </div>
            <pre class="bg-gray-100 border rounded-lg px-4 py-3 font-mono text-sm overflow-x-auto whitespace-pre-wrap break-all" x-text="output"></pre>
        </div>

        <p x-show="error" class="mt-4 text-sm text-red-600" x-text="error"></p>
    </main>

    <footer class="mt-16 py-8 text-center text-sm text-gray-500"><p>🔒 Processing happens entirely in your browser.</p></footer>
    <script>
    function base64Tool() {
        return {
            mode: 'encode', input: '', output: '', error: '', copied: false,
            encode() {
                this.error = '';
                try {
                    this.output = btoa(unescape(encodeURIComponent(this.input)));
                } catch(e) { this.error = 'Encoding failed: ' + e.message; }
            },
            decode() {
                this.error = '';
                try {
                    this.output = decodeURIComponent(escape(atob(this.input.trim())));
                } catch(e) { this.error = 'Invalid Base64 input'; }
            }
        };
    }
    </script>
</body>
</html>
