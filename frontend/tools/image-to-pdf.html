<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image to PDF - Cloudry</title>
    <meta name="description" content="Convert images to PDF online for free. Combine multiple images into one PDF document.">
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☁️</text></svg>">
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-494WQJ79BE"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-494WQJ79BE');
</script>
</head>
<body class="bg-gray-50 min-h-screen">
    <header class="bg-white shadow-sm">
        <div class="max-w-4xl mx-auto px-4 py-4 flex items-center justify-between">
            <a href="../" class="flex items-center gap-2"><span class="text-2xl">☁️</span><span class="text-xl font-bold text-gray-800">Cloudry</span></a>
            <a href="../" class="text-sm text-blue-600 hover:underline">← All Tools</a>
        </div>
    </header>

    <main class="max-w-2xl mx-auto px-4 py-12" x-data="imageToPdf()">
        <h1 class="text-3xl font-bold text-gray-900 mb-2">📄 Image to PDF</h1>
        <p class="text-gray-600 mb-8">Convert one or more images into a single PDF document.</p>

        <div class="bg-white rounded-xl border-2 border-dashed border-gray-300 p-8 text-center hover:border-blue-400 transition cursor-pointer"
             @click="$refs.fileInput.click()">
            <input type="file" x-ref="fileInput" @change="handleFiles($event)" accept="image/*" multiple class="hidden">
            <template x-if="files.length === 0">
                <div><p class="text-4xl mb-3">🖼️</p><p class="text-gray-700 font-medium">Drop images here or click to select</p><p class="text-sm text-gray-500 mt-1">JPEG, PNG, WebP • Multiple files OK</p></div>
            </template>
            <template x-if="files.length > 0">
                <div><p class="text-4xl mb-3">✅</p><p class="text-gray-700 font-medium" x-text="files.length + ' image(s) selected'"></p></div>
            </template>
        </div>

        <div x-show="files.length > 0" class="mt-4 space-y-2">
            <template x-for="(file, i) in files" :key="i">
                <div class="flex items-center justify-between bg-white border rounded-lg px-4 py-2">
                    <span class="text-sm text-gray-700" x-text="file.name"></span>
                    <button @click="files.splice(i, 1)" class="text-red-500 text-sm hover:underline">Remove</button>
                </div>
            </template>
        </div>

        <button x-show="files.length > 0" @click="convert()" :disabled="loading"
                class="mt-6 w-full bg-blue-600 text-white py-3 px-6 rounded-lg font-medium hover:bg-blue-700 disabled:bg-gray-400 transition">
            <span x-show="!loading">📄 Convert to PDF</span>
            <span x-show="loading">⏳ Converting...</span>
        </button>
        <p id="status" class="mt-4 text-sm font-medium"></p>
    </main>

    <footer class="mt-16 py-8 text-center text-sm text-gray-500"><p>🔒 Files processed in memory. Never stored.</p></footer>
    <script src="../assets/js/app.js"></script>
    <script>
    function imageToPdf() {
        return {
            files: [], loading: false,
            handleFiles(e) { this.files = [...this.files, ...e.target.files]; },
            async convert() {
                this.loading = true;
                const fd = new FormData();
                this.files.forEach(f => fd.append('files', f));
                try { await submitTool('/image/to-pdf', fd, 'images.pdf'); } catch(e) {}
                this.loading = false;
            }
        };
    }
    </script>
</body>
</html>
