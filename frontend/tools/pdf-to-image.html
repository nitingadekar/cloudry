<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF to Image - Cloudry</title>
    <meta name="description" content="Convert PDF pages to PNG or JPG images online for free.">
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☁️</text></svg>">
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-494WQJ79BE"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-494WQJ79BE');
</script>
</head>
<body class="bg-gray-50 min-h-screen">
    <header class="bg-white shadow-sm">
        <div class="max-w-4xl mx-auto px-4 py-4 flex items-center justify-between">
            <a href="../" class="flex items-center gap-2"><span class="text-2xl">☁️</span><span class="text-xl font-bold text-gray-800">Cloudry</span></a>
            <a href="../" class="text-sm text-blue-600 hover:underline">← All Tools</a>
        </div>
    </header>

    <main class="max-w-2xl mx-auto px-4 py-12" x-data="pdfToImage()">
        <h1 class="text-3xl font-bold text-gray-900 mb-2">🖼️ PDF to Image</h1>
        <p class="text-gray-600 mb-8">Convert PDF pages to PNG or JPG images. Downloads as a ZIP file.</p>

        <div class="bg-white rounded-xl border-2 border-dashed border-gray-300 p-8 text-center hover:border-blue-400 transition cursor-pointer"
             @click="$refs.fileInput.click()">
            <input type="file" x-ref="fileInput" @change="handleFile($event)" accept=".pdf" class="hidden">
            <template x-if="!file">
                <div><p class="text-4xl mb-3">📄</p><p class="text-gray-700 font-medium">Drop a PDF here or click to select</p></div>
            </template>
            <template x-if="file">
                <div><p class="text-4xl mb-3">✅</p><p class="text-gray-700 font-medium" x-text="file.name"></p></div>
            </template>
        </div>

        <div class="mt-4" x-show="file">
            <label class="block text-sm font-medium text-gray-700 mb-1">Output format</label>
            <select x-model="format" class="w-full border border-gray-300 rounded-lg px-3 py-2">
                <option value="png">PNG (higher quality, larger file)</option>
                <option value="jpg">JPG (smaller file)</option>
            </select>
        </div>

        <button x-show="file" @click="convert()" :disabled="loading"
                class="mt-6 w-full bg-blue-600 text-white py-3 px-6 rounded-lg font-medium hover:bg-blue-700 disabled:bg-gray-400 transition">
            <span x-show="!loading">🖼️ Convert to Images</span>
            <span x-show="loading">⏳ Converting...</span>
        </button>
        <p id="status" class="mt-4 text-sm font-medium"></p>
    </main>

    <footer class="mt-16 py-8 text-center text-sm text-gray-500"><p>🔒 Files processed in memory. Never stored.</p></footer>
    <script src="../assets/js/app.js"></script>
    <script>
    function pdfToImage() {
        return {
            file: null, format: 'png', loading: false,
            handleFile(e) { this.file = e.target.files[0]; },
            async convert() {
                this.loading = true;
                const fd = new FormData();
                fd.append('file', this.file);
                fd.append('format', this.format);
                try { await submitTool('/pdf/to-image', fd, 'pdf_images.zip'); } catch(e) {}
                this.loading = false;
            }
        };
    }
    </script>
</body>
</html>
